<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SP500 12-Stage Strategy — Glance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  <style>
    :root {
      --bg: #0e1117; --card: #1a1e2e; --text: #e6e6e6; --muted: #8899aa;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
           background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.1rem; color: var(--muted); margin-bottom: 12px; text-align: center; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
    .action-card { text-align: center; }
    .action-label { font-size: 2.4rem; font-weight: 700; letter-spacing: 2px; }
    .action-HOLD { color: var(--blue); }
    .action-BUY { color: var(--green); }
    .action-SELL { color: var(--red); }
    .action-ADJUST { color: var(--amber); }
    .leverage { font-size: 1.4rem; color: var(--muted); margin-top: 4px; }
    .trigger { font-size: 0.85rem; color: var(--muted); margin-top: 8px; font-style: italic; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .metric { text-align: center; }
    .metric-value { font-size: 1.3rem; font-weight: 600; }
    .metric-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .stale-banner { background: var(--red); color: #fff; text-align: center;
                    padding: 8px; border-radius: 8px; margin-bottom: 12px; font-weight: 600; }
    .commentary { font-size: 0.85rem; line-height: 1.5; color: var(--muted); }
    .footer { text-align: center; font-size: 0.7rem; color: #556; margin-top: 16px; }
    .loading { text-align: center; color: var(--muted); padding: 40px; }
    .dd-warn { color: var(--amber); }
    .dd-danger { color: var(--red); }
    .chart-card { padding: 12px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .chart-title { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .toggle-group { display: flex; gap: 4px; }
    .toggle-btn {
      background: transparent; border: 1px solid #333; color: var(--muted);
      padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; cursor: pointer;
      font-family: inherit; transition: all 0.15s;
    }
    .toggle-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .toggle-btn:hover:not(.active) { border-color: var(--muted); }
    #chart-container { width: 100%; min-height: 180px; }
    .u-wrap { background: transparent !important; }
    .chart-legend { text-align: center; font-size: 0.65rem; color: var(--muted); margin-top: 4px; }
    .strategy-select-card { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
    .strategy-select-card label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .strategy-select-card select {
      flex: 1; background: #0f1320; color: var(--fg);
      border: 1px solid #2a3245; border-radius: 4px;
      padding: 6px 10px; font-size: 0.85rem; font-family: inherit; cursor: pointer;
    }
    .strategy-select-card select:focus { outline: none; border-color: var(--green); }
    .accounts-card-header { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px; }
    .accounts-card-header.live { background: var(--green); color: #000; }
    .accounts-card-header.paper { background: var(--amber); color: #000; }
    .account-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px; border-top: 1px solid #1a2030; flex-wrap: wrap; }
    .account-row:first-of-type { border-top: none; padding-top: 2px; }
    .account-row-name { font-weight: 600; font-size: 0.9rem; flex: 1 1 auto; min-width: 0; }
    .account-id { font-size: 0.65rem; color: #6b7a90; font-family: monospace; margin-left: 6px; font-weight: 400; }
    .account-row-nlv { font-weight: 600; font-size: 0.95rem; flex: 0 0 auto; text-align: right; }
    .account-row-positions { font-size: 0.7rem; color: var(--muted); flex: 1 1 100%; padding-left: 0; margin-top: 0; }
    .account-row-return { font-size: 0.7rem; flex: 1 1 100%; padding-left: 0; margin-top: 0; }
    .account-row-bench { color: var(--muted); margin-left: 4px; }
    .account-disconnected { font-size: 0.8rem; color: #556; font-style: italic; }
    @media (min-width: 600px) { .container { max-width: 520px; } .action-label { font-size: 3rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div id="stale-banner" class="stale-banner" style="display:none;"></div>
    <h1 id="header">SP500 12-Stage Strategy — loading…</h1>

    <div class="card strategy-select-card" id="strategy-select-card" style="display:none;">
      <label for="strategy-select">Strategy</label>
      <select id="strategy-select"></select>
    </div>

    <div class="card action-card">
      <div id="action" class="action-label">—</div>
      <div id="leverage" class="leverage"></div>
      <div id="trigger" class="trigger"></div>
    </div>

    <div class="card grid grid-3">
      <div class="metric">
        <div id="gspc" class="metric-value">—</div>
        <div class="metric-label">S&amp;P 500</div>
      </div>
      <div class="metric">
        <div id="trade-pnl" class="metric-value">—</div>
        <div class="metric-label">Trade P&amp;L</div>
      </div>
      <div class="metric">
        <div id="ytd" class="metric-value">—</div>
        <div class="metric-label">YTD Return</div>
      </div>
      <div class="metric">
        <div id="strat-1d" class="metric-value">—</div>
        <div class="metric-label">Strategy 1D</div>
      </div>
      <div class="metric">
        <div id="spy-1d" class="metric-value">—</div>
        <div class="metric-label">S&amp;P 500 1D</div>
      </div>
      <div class="metric">
        <div id="dd" class="metric-value">—</div>
        <div class="metric-label">Intra-trade DD</div>
      </div>
    </div>

    <div class="card grid">
      <div class="metric">
        <div id="cagr" class="metric-value">—</div>
        <div class="metric-label" id="cagr-label">CAGR</div>
      </div>
      <div class="metric">
        <div id="sharpe" class="metric-value">—</div>
        <div class="metric-label">Sharpe</div>
      </div>
      <div class="metric">
        <div id="maxdd" class="metric-value">—</div>
        <div class="metric-label">Max DD</div>
      </div>
      <div class="metric">
        <div id="bars-in-trade" class="metric-value">—</div>
        <div class="metric-label">Bars in trade</div>
      </div>
    </div>

    <div class="card">
      <div id="commentary" class="commentary">Loading…</div>
    </div>

    <div class="card" id="live-accounts-card" style="display:none;">
      <div class="accounts-card-header live">Live</div>
      <div id="live-accounts-rows"></div>
    </div>
    <div class="card" id="paper-accounts-card" style="display:none;">
      <div class="accounts-card-header paper">Paper</div>
      <div id="paper-accounts-rows"></div>
    </div>

    <div class="card chart-card" id="chart-card" style="display:none;">
      <div class="chart-header">
        <div class="toggle-group" id="view-toggle">
          <button class="toggle-btn view-btn active" data-view="backtest">Backtest</button>
          <button class="toggle-btn view-btn" data-view="live" id="live-btn" style="display:none">Live</button>
        </div>
        <div class="toggle-group" id="years-toggle">
          <button class="toggle-btn yr-btn active" data-years="1">1Y</button>
          <button class="toggle-btn yr-btn" data-years="3">3Y</button>
          <button class="toggle-btn yr-btn" data-years="5">5Y</button>
        </div>
      </div>
      <div id="chart-container"></div>
      <div class="chart-legend" id="chart-legend">
        <span style="color:#22c55e;">&#9644;</span> Strategy &nbsp;
        <span style="color:#8899aa;">&#9644;</span> S&amp;P 500
      </div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

<script>
const STATE_URL = 'https://mjooqyjofzsavuqqorcg.supabase.co/storage/v1/object/public/dashboard-glance/public_glance.json';

function fmt(n, d=1) { return n == null ? '—' : Number(n).toFixed(d); }
function fmtPct(n, d=1) { return n == null ? '—' : Number(n).toFixed(d) + '%'; }
function isStale(asOf) {
  // Check if as_of_date is older than 2 calendar days (handles weekends gracefully)
  const d = new Date(asOf + 'T16:00:00-04:00'); // NYSE close in ET
  const now = new Date();
  const diffMs = now - d;
  const diffDays = diffMs / (1000 * 60 * 60 * 24);
  // 3+ calendar days = likely stale (covers weekends: Fri→Mon = 3 days)
  return diffDays > 3.5;
}

// Global state for strategy switching without re-fetching
let currentState = null;
let currentStrategy = null;
const DEFAULT_STRATEGY = 'SP500_12_Stage_Strategy';

function getStrategyFromHash() {
  // URL hash → strategy key, e.g. #qqq → QQQ_via_SP500_12_Stage_Strategy
  const h = (location.hash || '').replace(/^#/, '').toLowerCase();
  if (!h) return null;
  if (h === 'qqq' || h === 'qqq_via_sp500_12_stage_strategy') return 'QQQ_via_SP500_12_Stage_Strategy';
  if (h === 'sp500' || h === 'spx' || h === 'sp500_12_stage_strategy') return 'SP500_12_Stage_Strategy';
  return null;
}

function shortHashFor(strategyKey) {
  if (strategyKey === 'QQQ_via_SP500_12_Stage_Strategy') return 'qqq';
  if (strategyKey === 'SP500_12_Stage_Strategy') return 'sp500';
  return strategyKey.toLowerCase();
}

async function load() {
  try {
    const resp = await fetch(STATE_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const s = await resp.json();
    currentState = s;

    const asOf = s.as_of_date || 'unknown';
    const action = (s.action && s.action.action) || 'UNKNOWN';
    const lev = s.leverage != null ? s.leverage : '?';
    const trigger = (s.action && s.action.trigger) || '';

    // Stale banner (shared across strategies — reflects pipeline freshness)
    if (isStale(asOf)) {
      const banner = document.getElementById('stale-banner');
      banner.textContent = `⚠ STALE — last update: ${asOf}`;
      banner.style.display = 'block';
    }

    // Populate strategy selector from state.strategies, then render the
    // initial selection (URL hash > default).
    const strategies = s.strategies || {};
    const select = document.getElementById('strategy-select');
    select.innerHTML = '';
    Object.keys(strategies).forEach(function(key) {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = strategies[key].label || key;
      select.appendChild(opt);
    });
    if (Object.keys(strategies).length > 1) {
      document.getElementById('strategy-select-card').style.display = '';
    }

    const initialKey = getStrategyFromHash() || (
      Object.keys(strategies).find(function(k) { return strategies[k].is_default; })
      || DEFAULT_STRATEGY
    );
    select.value = initialKey;
    renderForStrategy(s, initialKey);

    // Action card (shared — same SPX-driven action across strategies)
    const actionEl = document.getElementById('action');
    let displayAction = action;
    if (action === 'HOLD') {
      displayAction = lev > 0 ? 'LONG HOLD' : 'CASH HOLD';
    }
    actionEl.textContent = displayAction;
    actionEl.className = `action-label action-${action}`;
    document.getElementById('leverage').textContent = `${lev}× leverage`;
    document.getElementById('trigger').textContent = trigger;

    // Market + PnL metrics (shared — derived from SP500 strategy state).
    // QQQ-specific PnL (YTD on QQQ-execution etc.) is a future enhancement;
    // for now both views show the SP500 strategy's portfolio metrics, which
    // accurately reflect the SHARED signals driving both.
    const ms = s.market_state || {};
    const ps = s.pnl_state || {};
    const cs = s.catastrophe_stops || {};
    const eq_stop = cs.equity_stop || {};

    document.getElementById('gspc').textContent = fmt(ms.gspc_close, 1);

    const tradePnl = ps.unrealized_return_pct;
    const tradePnlEl = document.getElementById('trade-pnl');
    tradePnlEl.textContent = fmtPct(tradePnl);
    if (tradePnl != null) tradePnlEl.style.color = tradePnl >= 0 ? 'var(--green)' : 'var(--red)';

    const ytdPct = ps.ytd_return_pct;
    const ytdEl = document.getElementById('ytd');
    ytdEl.textContent = fmtPct(ytdPct);
    if (ytdPct != null) ytdEl.style.color = ytdPct >= 0 ? 'var(--green)' : 'var(--red)';

    const stratDay = ps.yesterday_strategy_return_pct;
    const stratDayEl = document.getElementById('strat-1d');
    stratDayEl.textContent = fmtPct(stratDay);
    if (stratDay != null) stratDayEl.style.color = stratDay >= 0 ? 'var(--green)' : 'var(--red)';

    const spyDay = ps.yesterday_spy_return_pct;
    const spyDayEl = document.getElementById('spy-1d');
    spyDayEl.textContent = fmtPct(spyDay);
    if (spyDay != null) spyDayEl.style.color = spyDay >= 0 ? 'var(--green)' : 'var(--red)';

    const ddPct = eq_stop.intra_dd_pct;
    const ddEl = document.getElementById('dd');
    ddEl.textContent = fmtPct(ddPct);
    if (ddPct != null) {
      if (ddPct > 10) ddEl.className = 'metric-value dd-danger';
      else if (ddPct > 5) ddEl.className = 'metric-value dd-warn';
    }

    // Bars in trade (shared)
    const ls = s.leverage_state || {};
    const hybrid = ls.tla_tle_hybrid || {};
    document.getElementById('bars-in-trade').textContent =
      hybrid.bars_since_entry != null ? hybrid.bars_since_entry : '—';

    // Commentary + footer (shared)
    const comm = s.simple_commentary || s.commentary || 'No commentary available.';
    document.getElementById('commentary').textContent = comm;
    const gen = s.generated_at_utc || '';
    document.getElementById('footer').textContent = `Generated: ${gen}`;

  } catch (err) {
    document.getElementById('header').textContent = 'SP500 12-Stage Strategy — Error';
    document.getElementById('commentary').textContent = `Failed to load state: ${err.message}`;
  }
}

// ── Strategy-specific rendering ────────────────────────────────────
// Called on initial load AND every time the user changes the strategy
// dropdown. Updates the page header, headline KPIs, trading accounts,
// and triggers the equity-chart reload — but does NOT touch the shared
// action/commentary/cycle state which is identical across strategies.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function buildAccountRow(name, data) {
  if (!data) return null;
  const row = document.createElement('div');
  row.className = 'account-row';
  const displayName = name.replace(/_/g, ' ').toUpperCase();
  const acctId = data.account_id_masked || '';

  const nameDiv = document.createElement('div');
  nameDiv.className = 'account-row-name';
  let nameHtml = escapeHtml(displayName);
  if (acctId) nameHtml += '<span class="account-id">' + escapeHtml(acctId) + '</span>';
  nameDiv.innerHTML = nameHtml;
  row.appendChild(nameDiv);

  const nlvDiv = document.createElement('div');
  nlvDiv.className = 'account-row-nlv';
  if (!data.connected) {
    nlvDiv.innerHTML = '<span class="account-disconnected">Not connected</span>';
    row.appendChild(nlvDiv);
    return row;
  }
  nlvDiv.textContent = data.equity != null
    ? '$' + Number(data.equity).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})
    : '\u2014';
  row.appendChild(nlvDiv);

  if (data.positions && data.positions.length > 0) {
    const posDiv = document.createElement('div');
    posDiv.className = 'account-row-positions';
    posDiv.innerHTML = data.positions.map(function(p) {
      var qty = p.qty != null ? Number(p.qty).toFixed(2) : '?';
      var val = p.market_value != null
        ? ' ($' + Number(p.market_value).toLocaleString(undefined, {maximumFractionDigits: 0}) + ')'
        : '';
      return escapeHtml(qty + ' ' + p.symbol + val);
    }).join(' · ');
    row.appendChild(posDiv);
  } else {
    const posDiv = document.createElement('div');
    posDiv.className = 'account-row-positions';
    posDiv.textContent = 'No positions yet (cash)';
    row.appendChild(posDiv);
  }

  const inc = data.inception;
  if (inc && inc.return_pct != null) {
    const retDiv = document.createElement('div');
    retDiv.className = 'account-row-return';
    const sign = inc.return_pct >= 0 ? '+' : '';
    const acctColor = inc.return_pct >= 0 ? 'var(--green)' : 'var(--red)';
    let html = '<span style="color:' + acctColor + ';font-weight:600;">'
      + sign + inc.return_pct.toFixed(2) + '%</span>'
      + '<span class="account-row-bench">since ' + escapeHtml(inc.inception_date) + '</span>';
    if (inc.bench_return_pct != null) {
      const benchSign = inc.bench_return_pct >= 0 ? '+' : '';
      const benchLabel = inc.bench_label || 'Benchmark';
      html += '<span class="account-row-bench">(' + escapeHtml(benchLabel) + ': '
        + benchSign + inc.bench_return_pct.toFixed(2) + '%)</span>';
    }
    retDiv.innerHTML = html;
    row.appendChild(retDiv);
  }
  return row;
}

function fillCard(cardId, rowsId, accounts) {
  const rowsContainer = document.getElementById(rowsId);
  rowsContainer.innerHTML = '';
  const names = Object.keys(accounts || {});
  names.forEach(function(name) {
    const row = buildAccountRow(name, accounts[name]);
    if (row) rowsContainer.appendChild(row);
  });
  document.getElementById(cardId).style.display = names.length > 0 ? '' : 'none';
}

function renderForStrategy(s, strategyKey) {
  currentStrategy = strategyKey;
  const strat = (s.strategies || {})[strategyKey] || {};
  const stratLabel = strat.label || 'SP500 12-Stage Strategy';
  const asOf = s.as_of_date || 'unknown';

  // Header label
  document.getElementById('header').textContent = `${stratLabel} — ${asOf}`;
  document.title = `${stratLabel} — Glance`;

  // Headline KPIs — read from strategy.headline if present, else fallback
  // to top-level state.headline.gspc (SP500 default).
  let h = {};
  if (strat.headline) {
    // headline shape: {<bench_key>: {cagr, sharpe, maxdd, span}}
    const hKeys = Object.keys(strat.headline);
    if (hKeys.length > 0) h = strat.headline[hKeys[0]] || {};
  }
  if (!h.cagr && s.headline && s.headline.gspc) {
    h = s.headline.gspc;
  }
  const benchSym = (strat.benchmark && strat.benchmark.symbol) || 'GSPC';
  document.getElementById('cagr').textContent = fmtPct(h.cagr);
  document.getElementById('cagr-label').textContent = `CAGR (${benchSym})`;
  document.getElementById('sharpe').textContent = fmt(h.sharpe, 3);
  document.getElementById('maxdd').textContent = fmtPct(h.maxdd);

  // Trading accounts (per-strategy split)
  const ta = strat.trading_accounts || s.trading_accounts || {};
  fillCard('live-accounts-card', 'live-accounts-rows', ta.live_accounts || {});
  fillCard('paper-accounts-card', 'paper-accounts-rows', ta.paper_accounts || {});

  // URL hash so the view is shareable
  const newHash = '#' + shortHashFor(strategyKey);
  if (location.hash !== newHash) {
    history.replaceState(null, '', newHash);
  }

  // Equity chart reloads using currentStrategy's URL.
  // Defensive check: on initial load(), the second <script> block (where
  // loadEquityCurve is defined) hasn't run yet — skip in that case;
  // the explicit loadEquityCurve() call at the bottom of that block
  // handles the first render.
  if (typeof loadEquityCurve === 'function') loadEquityCurve();
}

// Strategy selector change handler
document.getElementById('strategy-select').addEventListener('change', function(e) {
  if (currentState) renderForStrategy(currentState, e.target.value);
});

// React to URL hash changes (back/forward navigation)
window.addEventListener('hashchange', function() {
  const k = getStrategyFromHash();
  if (k && currentState && k !== currentStrategy) {
    document.getElementById('strategy-select').value = k;
    renderForStrategy(currentState, k);
  }
});

load();
// Auto-refresh every 5 minutes (re-renders for the current strategy)
setInterval(load, 5 * 60 * 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
// ── Equity Performance Chart ─────────────────────────────────────
// URL is selected per strategy from currentState.strategies[currentStrategy].
// Falls back to the SP500 curve when the per-strategy URL isn't published yet.
const SUPABASE_BASE = 'https://mjooqyjofzsavuqqorcg.supabase.co/storage/v1/object/public/dashboard-glance/';
const DEFAULT_EQUITY_OBJECT = 'public_equity_curve.json';

let eqData = null;
let uplotInst = null;
let chartView = 'backtest';  // 'backtest' or 'live'
let chartYears = 1;

function normalizeFromStart(arr) {
  const base = arr[0];
  if (!base || base === 0) return arr.map(() => 0);
  return arr.map(v => (v / base - 1) * 100);
}

function sliceToYears(ts, years) {
  const last = ts[ts.length - 1];
  const cutoff = last - years * 365.25 * 86400;
  let start = 0;
  for (let i = 0; i < ts.length; i++) {
    if (ts[i] >= cutoff) { start = i; break; }
  }
  return start;
}

function currentBenchLabel() {
  // Pull benchmark label from the active strategy block (set by renderForStrategy).
  if (currentState && currentStrategy) {
    const strat = (currentState.strategies || {})[currentStrategy];
    if (strat && strat.benchmark && strat.benchmark.label) return strat.benchmark.label;
  }
  return 'S&P 500';
}

function updateLegend() {
  const el = document.getElementById('chart-legend');
  const benchLabel = currentBenchLabel();
  if (chartView === 'live') {
    const acctType = (eqData.actual_account_type || 'paper').toUpperCase();
    el.innerHTML = '<span style="color:#f59e0b;">&#9644;</span> Actual (' + acctType + ') &nbsp;' +
                   '<span style="color:#8899aa;">&#9644;</span> ' + escapeHtml(benchLabel);
  } else {
    el.innerHTML = '<span style="color:#22c55e;">&#9644;</span> Strategy &nbsp;' +
                   '<span style="color:#8899aa;">&#9644;</span> ' + escapeHtml(benchLabel);
  }
}

function renderChart() {
  if (!eqData) return;

  var ts, line1, bm, seriesColor, seriesLabel, seriesFill;

  if (chartView === 'live' && eqData.actual_ts && eqData.actual_ts.length >= 2) {
    // Live view: actual equity + its matching S&P 500
    ts = eqData.actual_ts;
    line1 = eqData.actual_eq;
    bm = eqData.actual_bm || eqData.actual_eq; // fallback
    seriesColor = '#f59e0b';
    seriesLabel = 'Actual';
    seriesFill = 'rgba(245,158,11,0.08)';
  } else {
    // Backtest view (default): strategy + S&P 500
    var start = sliceToYears(eqData.ts, chartYears);
    ts = eqData.ts.slice(start);
    line1 = eqData.eq.slice(start);
    bm = eqData.bm.slice(start);
    seriesColor = '#22c55e';
    seriesLabel = 'Strategy';
    seriesFill = 'rgba(34,197,94,0.08)';
  }

  var line1Pct = normalizeFromStart(line1);
  var bmPct = normalizeFromStart(bm);

  var container = document.getElementById('chart-container');
  if (uplotInst) { uplotInst.destroy(); uplotInst = null; }
  container.innerHTML = '';

  var w = container.clientWidth || 340;
  var opts = {
    width: w, height: 180,
    cursor: { show: true, x: true, y: false },
    legend: { show: false },
    scales: { x: { time: true }, y: { auto: true } },
    axes: [
      {
        stroke: '#556',
        grid: { stroke: 'rgba(255,255,255,0.05)', width: 1 },
        ticks: { stroke: 'rgba(255,255,255,0.1)', width: 1 },
        font: '10px system-ui', gap: 4,
      },
      {
        stroke: '#556',
        grid: { stroke: 'rgba(255,255,255,0.05)', width: 1 },
        ticks: { stroke: 'rgba(255,255,255,0.1)', width: 1 },
        font: '10px system-ui', gap: 4,
        values: function(u, vals) { return vals.map(function(v) { return v.toFixed(0) + '%'; }); },
        size: 42,
      },
    ],
    series: [
      {},
      { label: seriesLabel, stroke: seriesColor, width: 2, fill: seriesFill },
      { label: 'S&P 500', stroke: '#8899aa', width: 1, dash: [4, 3] },
    ],
  };

  uplotInst = new uPlot(opts, [ts, line1Pct, bmPct], container);
  updateLegend();
}

const resizeObs = new ResizeObserver(function(entries) {
  if (uplotInst && entries[0]) {
    var w = entries[0].contentRect.width;
    if (w > 0) uplotInst.setSize({ width: w, height: 180 });
  }
});

// Year toggle buttons
document.querySelectorAll('.yr-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.yr-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    chartYears = parseInt(btn.dataset.years);
    renderChart();
  });
});

// View toggle buttons (Backtest / Live)
document.querySelectorAll('.view-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.view-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    chartView = btn.dataset.view;
    // In live view, year toggles don't apply (show all available data)
    var yearsToggle = document.getElementById('years-toggle');
    yearsToggle.style.opacity = chartView === 'live' ? '0.3' : '1';
    yearsToggle.style.pointerEvents = chartView === 'live' ? 'none' : 'auto';
    renderChart();
  });
});

async function loadEquityCurve() {
  // Pick the URL from the active strategy. Falls back to default SP500 curve
  // if the per-strategy URL isn't set.
  let objectName = DEFAULT_EQUITY_OBJECT;
  if (currentState && currentStrategy) {
    const strat = (currentState.strategies || {})[currentStrategy];
    if (strat && strat.equity_curve_object) objectName = strat.equity_curve_object;
  }
  const url = SUPABASE_BASE + objectName;
  try {
    var resp = await fetch(url, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    eqData = await resp.json();
    if (!eqData.ts || eqData.ts.length < 2) throw new Error('No data');
    document.getElementById('chart-card').style.display = '';

    // Live (actual equity) toggle: only show for SP500 strategy currently —
    // QQQ live equity tracking isn't wired yet, so the Live button stays
    // hidden when on the QQQ tab.
    const liveBtn = document.getElementById('live-btn');
    if (eqData.actual_ts && eqData.actual_ts.length >= 2 &&
        currentStrategy === 'SP500_12_Stage_Strategy') {
      liveBtn.style.display = '';
    } else {
      liveBtn.style.display = 'none';
      // If we'd been viewing the live chart, fall back to backtest
      if (chartView === 'live') {
        chartView = 'backtest';
        document.querySelectorAll('.view-btn').forEach(function(b) {
          b.classList.toggle('active', b.dataset.view === 'backtest');
        });
      }
    }

    renderChart();
    resizeObs.observe(document.getElementById('chart-container'));
  } catch (err) {
    console.warn('Equity curve load failed for ' + objectName + ':', err.message);
    // Hide chart card if we can't load any curve.
    document.getElementById('chart-card').style.display = 'none';
  }
}

// Initial chart load is triggered by renderForStrategy() inside load() above.
// If the page loaded with a deep-linked URL hash and load() already finished,
// trigger one more pass now that this script block has defined loadEquityCurve.
if (currentState && currentStrategy) loadEquityCurve();
</script>
